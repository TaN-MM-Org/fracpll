[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fracpll"
version = "0.6.1"
description = "Charge-pump fractional-N PLL design from measured pieces - loop stability, loop filter design, MASH quantization noise, closed-loop phase noise, measured tuning curves with Kvco uncertainty, nonlinear lock transients, measurement planning and uncertainty of the loop margins, with validity refusals"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tanvir Mahmud Mahim"}]
dependencies = ["numpy>=1.22", "scipy>=1.8"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/TaN-MM-Org/fracpll"
Issues = "https://github.com/TaN-MM-Org/fracpll/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
